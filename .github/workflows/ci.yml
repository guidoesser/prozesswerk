name: CI + Docker Release

on:
  push:
    branches: [main, production]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ─── Tests ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install Node dependencies (ELK.js)
        working-directory: backend
        run: npm install

      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    needs: test
    if: github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=ghcr.io/guidoesser/prozesswerk:${VERSION},ghcr.io/guidoesser/prozesswerk:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/guidoesser/prozesswerk:latest" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
